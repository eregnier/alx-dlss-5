[HLX_DLSS5]
; Enable / Disable neural reconstruction
Enabled=1

; Cheeky-inspired Foveated Rendering:
; Evaluates DLSS 5 neural reconstruction strictly inside the center sweetspot (fovea),
; and smoothly blends with native game pixels in the periphery via cosine smoothstep.
; Cuts neural workload by > 65% while keeping 100% full-resolution FOV coverage.
Foveated=1
FoveatedWidth=0.55
FoveatedHeight=0.55
FoveatedRoundness=0.50
FoveatedFeather=0.12
ShowBorder=0

; Working scale of neural evaluation relative to fovea region
WorkingScale=1.00

; Neural sharpness filter [0.0 - 1.0]
Sharpness=0.35

; Neural detail boost intensity [0.0 - 2.0]
DetailBoost=1.0

; Diagnostics: dump input & output textures to C:\code\hlx-dlss5 for NumPy matrix analysis
DumpFrames=0

; Fallback gracefully to vanilla texture if NGX feature is unavailable
FallbackOnError=1

; Interop flags
EnableD3D11Interop=1
EnableVulkanInterop=1

; Cheeky Transport: D3D11 <-> D3D12 GPU hardware fence (eliminates CPU WaitForSingleObject waits)
UseSharedHardwareFence=1

; Custom path to nvngx_dlssnr.dll (leave blank to search standard directories automatically)
DLSSNR_Path=
