[HLX_DLSS5]
; Enable / Disable neural reconstruction
Enabled=1

; Cheeky-inspired Dynamic Foveated Rendering (DFR / Eye Tracking):
; Evaluates DLSS 5 neural reconstruction strictly inside the fovea (0.00 = 0% / bypass, up to 1.00 = 100%),
; and smoothly blends with native game pixels in the periphery via cosine smoothstep.
; When EyeTracking=1 and the headset provides eye tracking (e.g. Pimax Crystal / SteamVR Eye Tracking),
; the fovea follows your pupils in real time so you can shrink FoveatedWidth/Height (e.g. 0.25 - 0.35)!
Foveated=1
FoveatedWidth=0.55
FoveatedHeight=0.55
FoveatedRoundness=0.50
FoveatedFeather=0.12
EyeTracking=1
GazeSmoothingMs=35.0
GazeQuantizationPixels=8
GazeJumpResetRatio=0.60
ShowBorder=0

; Working scale of neural evaluation relative to fovea region [0.35 - 1.00]
; With Matched Residual Composition (delta = Neural - InputProxy added onto full-res native pixels),
; WorkingScale=0.50 cuts GPU neural inference time by 4x while preserving 100% native pixel sharpness!
WorkingScale=0.50

; Neural sharpness filter [0.0 - 1.0]
Sharpness=0.50

; Neural detail boost intensity [0.0 - 2.0]
DetailBoost=1.25

; DLSS 5 Neural Model parameters (Preset 2 = Performance VR topology, Passes = 1..3 sequential layers)
Passes=1
Preset=2
Style=0
AutoMask=1
LocalStructure=1.00
LocalTone=0.00
SkinStructure=-1.00

; Diagnostics: dump input & output textures to C:\code\hlx-dlss5 for NumPy matrix analysis
DumpFrames=0

; Fallback gracefully to vanilla texture if NGX feature is unavailable
FallbackOnError=1

; Interop flags
EnableD3D11Interop=1
EnableVulkanInterop=1

; Cheeky Transport: D3D11 <-> D3D12 GPU hardware fence (eliminates CPU WaitForSingleObject waits)
UseSharedHardwareFence=1

; Custom path to nvngx_dlssnr.dll (leave blank to search standard directories automatically)
DLSSNR_Path=
